<!DOCTYPE html>

<head>

<title>Shortform Engine</title>
<style>

  * { box-sizing:border-box; margin:0; padding:0; }

  body { font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }

  .nd { font-size:29px; color:#3c3c43; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- desktop windows ---------- */

  .tb i { width:16px; height:16px; border-radius:50%; display:block; }
  .tb span { position:absolute; left:0; right:0; text-align:center; font-size:25px; color:#b5b5bb; font-weight:700; }

  .av { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:28px; color:#000; flex:none; }

  .panel { position:absolute; left:0; width:1080px; height:960px; overflow:hidden; }
  .tag { display:inline-block; font-size:34px; font-weight:900; letter-spacing:.12em; padding:10px 26px; border-radius:40px; }
  .svc { position:absolute; left:540px; transform:translate(-50%,-50%); border:2px solid #444; border-radius:60px; padding:18px 40px; font-size:44px; font-weight:700; color:#d8d8dc; white-space:nowrap; }
  .btn { position:absolute; left:540px; width:900px; height:156px; border-radius:80px; background:#fff; color:#000; display:flex; align-items:center; justify-content:center;
         font-size:56px; font-weight:900; white-space:nowrap; letter-spacing:-0.03em; }
  .ring { position:absolute; left:540px; width:900px; height:156px; border-radius:80px; border:4px solid #fff; }
  .logo-ph { width:120px; height:120px; border-radius:30px; border:3px dashed #666; display:flex; align-items:center; justify-content:center; color:#777; font-size:26px; font-weight:900; }
</style>

}},"chaosCaption":["문제는 AI가","없는 게 아니라"]},"turn":{"text":"일의 구조입니다."},"after":{"words":["나누고.","판단하고.","필요한 곳에만 AI."],"input":"고객 문의","classifier":"업무 분류","classifierSub":"유형 · 긴급도 · 규칙","lanes":[{"key":"ai","label":"AI · 자동화","sub":"반복 · 규칙","color":"#4F8CFF"},{"key":"human","label":"사람 판단","sub":"판단 필요","color":"#F5A524"},{"key":"exception","label":"예외 전달","sub":"담당자에게","color":"#FF5A5F"}],"items":[{"text":"배송 조회","lane":"ai"},{"text":"환불 요청","lane":"human"},{"text":"영업시간 문의","lane":"ai"},{"text":"제품 파손","lane":"exception"},{"text":"옵션 변경","lane":"ai"},{"text":"단체 견적","lane":"human"},{"text":"재입고 알림","lane":"ai"},{"text":"주소 변경","lane":"ai"},{"text":"클레임","lane":"exception"},{"text":"교환 가능?","lane":"human"},{"text":"송장 번호","lane":"ai"},{"text":"영수증 발급","lane":"ai"}]},"result":{"title":"오늘의 문의 현황","headline":"한눈에.","kpis":[{"label":"자동 처리","value":32,"lane":"ai"},{"label":"사람 판단","value":12,"lane":"human"},{"label":"예외 전달","value":3,"lane":"exception"}],"reviewTitle":"사람 판단 필요","reviews":[{"who":"김","text":"환불 요청 · 주문 2381","status":"검토중","lane":"human"},{"who":"박","text":"단체 견적 50개","status":"대기","lane":"human"},{"who":"이","text":"제품 파손 · 사진 확인","status":"전달됨","lane":"exception"}],"pendingLabel":"미처리 문의","pendingValue":0},"compare":{"before":{"tag":"BEFORE","text":"사람 머릿속 업무"},"after":{"tag":"AFTER","text":"누구나 따라가는 시스템"}},"core":{"first":"AI를 추가하지 않습니다.","second":["일하는 방식을","다시 설계합니다."],"highlight":"다시 설계"},"cta":{"service":"업무 구조화 · AI 워크플로 설계","question":["우리 업무도","바꿀 수 있을까?"],"button":"크몽에서 업무 진단받기 →"}};window.HOOK_BG={"count":48,"fps":30,"dim":0.38,"base":"hook_bg/"};window.AUDIO_SRC='music.wav';</script>
<script>
/* =====================================================================
   SHORTFORM ENGINE  —  window.CONFIG 를 받아 render(t) 로 매 프레임을 그린다.
   구조(장면 순서·연출)는 이 파일, 내용(문구·데이터)은 episodes/<에피소드>/config.json
   ===================================================================== */
const C = window.CONFIG;
const W = 1080, H = 1920;
const T = Object.assign({
  hook:0, stop:1.5, stopHit:1.9, before:2.5, beat:0.5, chaos:5.0, turn:7.0, turnMorph:7.3, turnText:8.0, turnOut:9.6,
  after:10.0, afterWords:[10.5,12.0,13.5], chipStart:10.55, chipGap:0.28, gather:14.55, result:15.0,
  compare:17.0, core:18.5, core2:19.4, cta:21.0, end:25.0
}, C.timeline || {});
const LANE_COLOR = {}; C.after.lanes.forEach(l => LANE_COLOR[l.key] = l.color);
const LANE_IDX = {}; C.after.lanes.forEach((l,i) => LANE_IDX[l.key] = i);

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eCubic=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(20260925);
const stage = document.getElementById('stage');
function mk(tag, cls, parent, html){const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; (parent||stage).appendChild(e); return e;}
function layer(){const l=mk('div','layer'); l.style.display='block'; return l;}
function svgEl(tag, attrs, parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e;}
function svgLayer(parent){return svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,style:'position:absolute;left:0;top:0;overflow:visible'},parent);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// 큰 글씨: 가로폭에 맞춰 자동 축소
function bigText(parent, text, y, size, maxW=980, color='#fff'){
  const e=mk('div','txt',parent,text); e.style.top=y+'px'; e.style.color=color; e.style.fontSize=size+'px';
  e.style.visibility='hidden'; e.style.display='block';
  let s=size; while(e.offsetWidth>maxW && s>30){s-=2; e.style.fontSize=s+'px';}
  e.style.visibility=''; e.style.opacity=0; return e;
}
function setTx(e,{x=0,y=0,s=1,o=1,r=0}={}){e.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; e.style.opacity=o;}
// 박자에 맞춰 "쾅" 들어오는 글자
function punch(e,t,t0,t1=1e9,from=1.35){
  if(t<t0||t>=t1){e.style.opacity=0;return;}
  const p=eExpo(P(t,t0,t0+0.28)); setTx(e,{s:lerp(from,1,p),o:P(t,t0,t0+0.05)});
}
const CUES = {hits:[], words:[], clicks:[], whoosh:[], ticks:[], silence:[], chipLand:[]};

/* =====================================================================
   1) HOOK — 알림 폭탄
   ===================================================================== */
const Lhook = layer();
// 실사 배경 (선택): config.hook.background → render.js 가 프레임을 뽑아 window.HOOK_BG 로 넘겨줌
const HB = window.HOOK_BG, hbImgs = [];
let hbCanvas = null, hbCtx = null, hbShade = null;
if (HB && HB.count) {
  for (let i = 0; i < HB.count; i++) { const im = new Image(); im.src = HB.base + String(i + 1).padStart(3, '0') + '.jpg'; hbImgs.push(im); }
  hbCanvas = mk('canvas', 'abs', Lhook); hbCanvas.width = W; hbCanvas.height = H; Object.assign(hbCanvas.style, {left:0, top:0, width:W+'px', height:H+'px', zIndex:0});
  hbCtx = hbCanvas.getContext('2d');
  const d = HB.dim != null ? HB.dim : 0.5;
  hbShade = mk('div', 'abs', Lhook); Object.assign(hbShade.style, {inset:0, zIndex:0,
    background:`radial-gradient(ellipse at 50% 45%,rgba(0,0,0,${d*0.7}) 0%,rgba(0,0,0,${Math.min(1,d+0.3)}) 100%),linear-gradient(180deg,rgba(8,10,20,.35),rgba(0,0,0,0) 40%,rgba(0,0,0,.4))`});
}
window.ASSETS_READY = Promise.all(hbImgs.map(im => im.decode().catch(() => {})));
function renderHookBg(t){
  if (!hbCtx) return;
  const im = hbImgs[Math.min(hbImgs.length - 1, Math.max(0, Math.floor(t * (HB.fps || 30))))];
  if (!im || !im.complete || !im.naturalWidth) return;
  const s = 1.1 - 0.06 * eCubic(P(t, 0, 1.5));   // 천천히 당겨지는 느낌 (알림 줌과 반대 방향)
  const w = W * s, h = H * s;
  hbCtx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
}

  if(s<0.2){const p=eCubic(s/0.2); return [540, lerp(-60,NODE_IN.y,p), 0];}
  if(s<0.26) return [540, NODE_IN.y, 0];
  if(s<0.4){const p=eInOut((s-0.26)/0.14); return [540, lerp(NODE_IN.y,NODE_CL.y,p), 0];}
  if(s<0.46) return [540, NODE_CL.y, 1];
  if(s<0.62){const p=eInOut((s-0.46)/0.16); const pt=br.getPointAtLength(br._len*p); return [pt.x,pt.y,1];}
  if(s<0.72){const p=eCubic((s-0.62)/0.1); return [lx, lerp(LANE_Y-75,sy,p), 1];}
  return [lx, sy, 1];
}
function renderFlow(t){
  flowWrap.style.transform='';
  const a=T.after;
  // nodes
  const pin=eBack(P(t,a,a+0.25)), pcl=eBack(P(t,a+0.25,a+0.5));
  setTx(nIn,{s:pin,o:clamp(pin)}); setTx(nCl,{s:pcl,o:clamp(pcl)});
  trunk.setAttribute('opacity',P(t,a,a+0.1)); trunkIn.setAttribute('opacity',0.35*P(t,a,a+0.2));
  trunkIn.setAttribute('stroke-dashoffset', -t*120);
  branches.forEach((b,i)=>{ if(!b._len) b._len=b.getTotalLength(); const p=eCubic(P(t,a+0.55+i*0.08,a+0.85+i*0.08)); b.setAttribute('stroke-dasharray',b._len); b.setAttribute('stroke-dashoffset',b._len*(1-p)); });
  // emphasis
  const w=T.afterWords; let focus=-1;
  if(t>=w[1]&&t<w[2]) focus=LANE_IDX.human; else if(t>=w[2]&&t<T.gather-0.1) focus=LANE_IDX.ai;
  laneEls.forEach((e,i)=>{const p=eBack(P(t,a+0.6+i*0.1,a+0.85+i*0.1)); const f= focus===i;
    setTx(e,{s:p*(f?1.08:1),o:clamp(p)*(focus>=0&&!f?0.45:1)});
    e.style.boxShadow = f? `0 0 60px ${C.after.lanes[i].color}` : 'none';
    e.style.background = f? C.after.lanes[i].color+'33' : '#101014';
    const n=CHIPS.filter(c=>c.li===i && t>=c.t0+0.72).length; e.cnt.textContent=n; });
  branches.forEach((b,i)=>b.setAttribute('opacity', focus>=0&&focus!==i?0.3:1));
  // classifier pulse on each chip
  let pulse=0, pc='#3a3a40'; CHIPS.forEach(c=>{const s=t-c.t0; if(s>=0.38&&s<0.5){pulse=1-(s-0.38)/0.12; pc=LANE_COLOR[c.it.lane];}});
  nCl.style.borderColor = pulse>0? pc : '#3a3a40'; nCl.style.boxShadow = pulse>0? `0 0 ${50*pulse}px ${pc}`:'none';
  let pin2=0; CHIPS.forEach(c=>{const s=t-c.t0; if(s>=0.18&&s<0.3) pin2=1;}); nIn.style.borderColor=pin2?'#fff':'#3a3a40';
  // chips
  CHIPS.forEach(c=>{
    if(t<c.t0){c.e.style.opacity=0;return;}
    const [x,y,cls]=chipPos(c,t);
    let gx=x, gy=y, sc=1, op=1;
    // gather → 대시보드 KPI 로 빨려 들어감
    if(t>=T.gather){const g=eInOut(P(t,T.gather+c.li*0.04+c.slot*0.015,T.gather+0.42+c.li*0.04)); gx=lerp(x,KPI_C[c.li][0],g); gy=lerp(y,KPI_C[c.li][1],g); sc=lerp(1,0.3,g); op=1-P(g,0.75,1);}
    c.e.style.transform=`translate(${gx-145}px,${gy-30}px) scale(${sc})`; c.e.style.opacity=op;
    const col=LANE_COLOR[c.it.lane];
    c.e.style.borderColor = cls? col : '#55555c'; c.e.style.background = cls? '#15151a':'#2A2A2F';
    c.tg.style.background = cls? col : '#666'; c.tg.style.display = cls?'':'none';
    c.e.style.zIndex=20;
  });
  // words
  flowWords.forEach((e,i)=>{punch(e,t,w[i],i<w.length-1?w[i+1]:T.gather,1.4);});
  // gather: 흐름 다이어그램 퇴장
  const g=P(t,T.gather,T.gather+0.3);
  [nIn,nCl,...laneEls].forEach(e=>{e.style.opacity=parseFloat(e.style.opacity||1)*(1-g);});
  fSvg.style.opacity=1-g;
}
C.after.words.forEach((w,i)=>CUES.hits.push({t:T.afterWords[i],k:'stab'}));

/* =====================================================================
   6) RESULT — 대시보드
   ===================================================================== */
const Ldash = layer();
const dashHead = bigText(Ldash, esc(C.result.headline||''), 230, 130);
const dash = mk('div','dash',Ldash);
dash.innerHTML = `<div class="dh"><div class="t">${esc(C.result.title)}</div><div class="live">● 실시간</div></div>
<div class="kpis">${C.result.kpis.map(k=>`<div class="kpi"><div class="kl">${esc(k.label)}</div><div class="kv" style="color:${LANE_COLOR[k.lane]}">0</div></div>`).join('')}</div>
<div class="sbar">${C.result.kpis.map(k=>`<div style="background:${LANE_COLOR[k.lane]}"></div>`).join('')}</div>
<div class="rv-t">${esc(C.result.reviewTitle)}</div>
${C.result.reviews.map(r=>`<div class="rv"><div class="av" style="background:${LANE_COLOR[r.lane]}">${esc(r.who)}</div><div>${esc(r.text)}</div><div class="pill" style="color:${LANE_COLOR[r.lane]};border-color:${LANE_COLOR[r.lane]}">${esc(r.status)}</div></div>`).join('')}
<div class="pend"><div class="pl">${esc(C.result.pendingLabel)}</div><div class="pv"><span>0</span>건</div></div>`;
const kvs=[...dash.querySelectorAll('.kv')], segs=[...dash.querySelectorAll('.sbar div')], rvs=[...dash.querySelectorAll('.rv')], pendV=dash.querySelector('.pv span'), pend=dash.querySelector('.pend');
const KPI_C=[[60+60+130,380+56+60+44+110],[60+60+130+290,380+56+60+44+110],[60+60+130+580,380+56+60+44+110]];
const kTot = C.result.kpis.reduce((s,k)=>s+k.value,0);
CUES.hits.push({t:T.result,k:'soft'});
function renderDash(t){
  const a=T.gather+0.15;
  const p=eExpo(P(t,a,a+0.45));
  dash.style.opacity=clamp(P(t,a,a+0.15)); dash.style.transform=`translateY(${lerp(120,0,p)}px) scale(${lerp(0.94,1,p)})`;
  punch(dashHead,t,T.result,1e9,1.3);
  C.result.kpis.forEach((k,i)=>{kvs[i].textContent=Math.round(k.value*eCubic(P(t,a+0.2,a+0.9)));
    segs[i].style.width = (100*k.value/kTot*eInOut(P(t,a+0.35,a+1.0)))+'%';});
  rvs.forEach((r,i)=>{const pp=eExpo(P(t,a+0.5+i*0.12,a+0.8+i*0.12)); r.style.opacity=pp; r.style.transform=`translateX(${lerp(60,0,pp)}px)`;});
  const pv=Math.round(lerp(C.before.counterTo, C.result.pendingValue, eInOut(P(t,T.result+0.3,T.result+1.3))));
  pendV.textContent=pv; pend.style.opacity=clamp(P(t,a+0.3,a+0.5));
  pend.style.boxShadow = pv===C.result.pendingValue && t>T.result+1.3 ? `0 0 ${40*(1-P(t,T.result+1.3,T.result+1.9))}px #34C759` : 'none';
}

/* =====================================================================
   7) BEFORE / AFTER 비교
   ===================================================================== */
const Lcmp = layer();
const pTop = mk('div','panel',Lcmp); pTop.style.top='0'; pTop.style.background='linear-gradient(180deg,#1a0708,#0a0303)';
const pBot = mk('div','panel',Lcmp); pBot.style.top='960px'; pBot.style.background='linear-gradient(180deg,#040b18,#071a33)';
const topSvg = svgEl('svg',{width:1080,height:960,style:'position:absolute;left:0;top:0'},pTop);
const botSvg = svgEl('svg',{width:1080,height:960,style:'position:absolute;left:0;top:0'},pBot);
const miniWins=[[160,330],[600,330],[160,620],[600,620]].map(([x,y])=>svgEl('rect',{x,y,width:320,height:230,rx:22,fill:'#1b1b1f',stroke:'#3a3a40','stroke-width':3},topSvg));
const miniLines = LINES.slice(0,22).map(L=>svgEl('path',{d:lineD(L.src.map(p=>[p[0]*0.8+108, p[1]*0.4+250])),fill:'none',stroke:L.red?'#FF5A5F':'#fff','stroke-width':3,opacity:.7},topSvg));
const topTxt = mk('div','abs',pTop,`<div class="tag" style="background:#FF5A5F;color:#000">${esc(C.compare.before.tag)}</div>`); Object.assign(topTxt.style,{left:'0',right:'0',top:'70px',textAlign:'center'});
const topBig = bigText(pTop, esc(C.compare.before.text), 210, 96);
// after mini flow
const mb = (x,y,w,h,col)=>svgEl('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:18,fill:'#0e1422',stroke:col,'stroke-width':3},botSvg);
svgEl('path',{d:'M540,340 L540,430',stroke:'#fff','stroke-width':4},botSvg);
const lanesMini=C.after.lanes.map((l,i)=>{const x=[250,540,830][i]; svgEl('path',{d:`M540,490 C540,560 ${x},560 ${x},620`,stroke:l.color,'stroke-width':4,fill:'none'},botSvg); return x;});
mb(540,310,320,70,'#888'); mb(540,460,360,70,'#fff');
C.after.lanes.forEach((l,i)=>{mb(lanesMini[i],660,220,70,l.color); for(let k=0;k<3;k++) svgEl('rect',{x:lanesMini[i]-95,y:720+k*52,width:190,height:38,rx:10,fill:l.color,opacity:.35},botSvg);});
const miniDots = [0,1,2,3,4,5].map(i=>svgEl('circle',{r:9,fill:'#fff'},botSvg));
const botTxt = mk('div','abs',pBot,`<div class="tag" style="background:#4F8CFF;color:#000">${esc(C.compare.after.tag)}</div>`); Object.assign(botTxt.style,{left:'0',right:'0',top:'60px',textAlign:'center'});
const botBig = bigText(pBot, esc(C.compare.after.text), 200, 96);
const arrow = mk('div','abs',Lcmp,'<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="62" fill="#fff"/><path d="M65 35 L65 92 M42 70 L65 93 L88 70" stroke="#000" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
Object.assign(arrow.style,{left:'475px',top:'895px'});
CUES.whoosh.push({t:T.compare,d:0.2,k:'swish'},{t:T.compare+0.3,d:0.2,k:'swish'}); CUES.hits.push({t:T.compare+0.5,k:'soft'});
function renderCmp(t){
  const a=T.compare;
  const p1=eExpo(P(t,a,a+0.25)), p2=eExpo(P(t,a+0.3,a+0.55));
  pTop.style.transform=`translateY(${lerp(-960,0,p1)}px)`; pBot.style.transform=`translateY(${lerp(960,0,p2)}px)`;
  const ap=eBack(P(t,a+0.5,a+0.7)); arrow.style.transform=`scale(${ap})`; arrow.style.opacity=clamp(ap);
  setTx(topBig,{o:1}); setTx(botBig,{o:1});
  miniLines.forEach((l,i)=>l.setAttribute('transform',`translate(${Math.sin(t*30+i)*6},${Math.cos(t*27+i)*6})`));
  miniWins.forEach((r,i)=>r.setAttribute('transform',`translate(${Math.sin(t*25+i*3)*5},${Math.cos(t*22+i)*5})`));
  miniDots.forEach((d,i)=>{const u=((t*1.3+i/6)%1); const lane=i%3; let x,y; if(u<0.4){x=540;y=lerp(260,460,u/0.4);} else {const v=(u-0.4)/0.6; x=lerp(540,lanesMini[lane],eInOut(v)); y=lerp(490,660,v);} d.setAttribute('cx',x); d.setAttribute('cy',y); d.setAttribute('fill',C.after.lanes[lane].color);});
}

/* =====================================================================
   8) CORE MESSAGE
   ===================================================================== */
const Lcore = layer();
const core1 = bigText(Lcore, esc(C.core.first), 900, 92, 960, '#d6d6d6');
function hl(s){const h=C.core.highlight; return h&&s.includes(h)? esc(s).replace(esc(h),`<span style="color:${C.brand.accent};position:relative">${esc(h)}<i class="ul" style="position:absolute;left:0;right:0;bottom:-6px;height:12px;background:${C.brand.accent};border-radius:6px;transform-origin:left;display:block"></i></span>`) : esc(s);}
const core2 = C.core.second.map((s,i)=>bigText(Lcore, hl(s), 1000+i*185, 168));
const uls=[...Lcore.querySelectorAll('.ul')];
CUES.silence.push([T.core+0.55, T.core2]); CUES.hits.push({t:T.core,k:'soft'},{t:T.core2,k:'impact'});
function renderCore(t){
  const p=eExpo(P(t,T.core,T.core+0.35)); const m=eInOut(P(t,T.core2,T.core2+0.3));
  setTx(core1,{o:clamp(P(t,T.core,T.core+0.15))*lerp(1,0.45,m), y:lerp(40,0,p)+lerp(0,-240,m), s:lerp(1,0.8,m)});
  core2.forEach((e,i)=>punch(e,t,T.core2+i*0.12,1e9,1.35));
  uls.forEach(u=>u.style.transform=`scaleX(${eCubic(P(t,T.core2+0.3,T.core2+0.6))})`);
}

/* =====================================================================
   9) CTA
   ===================================================================== */
const Lcta = layer();
const ctaSvg = svgLayer(Lcta);
const ctaLines=[...Array(24)].map((_,i)=>svgEl('path',{d:`M0,${80+i*80} L1080,${80+i*80}`,stroke:'#fff','stroke-width':1.5,opacity:.07},ctaSvg));
const svc = mk('div','svc',Lcta,esc(C.cta.service)); svc.style.top='430px';
const q = C.cta.question.map((s,i)=>bigText(Lcta, esc(s), 690+i*165, 140));
const ring = mk('div','ring',Lcta); ring.style.top='1070px';
const btn = mk('div','btn',Lcta,esc(C.cta.button)); btn.style.top='1070px';
{ let s=56; btn.style.fontSize=s+'px'; while(btn.scrollWidth>840&&s>30){s-=2;btn.style.fontSize=s+'px';} }
const brandBox = mk('div','abs',Lcta, `${C.brand.logo?`<img src="${C.brand.logo}" style="width:120px;height:120px;border-radius:30px;object-fit:contain">`:'<div class="logo-ph">LOGO</div>'}<div style="font-size:48px;font-weight:900;letter-spacing:-0.02em">${esc(C.brand.name)}</div>`);
Object.assign(brandBox.style,{left:'0',right:'0',top:'1560px',display:'flex',alignItems:'center',justifyContent:'center',gap:'28px'});
CUES.hits.push({t:T.cta,k:'soft'},{t:T.cta+0.25,k:'stab'},{t:T.cta+0.75,k:'impact2'});
function renderCta(t){
  const a=T.cta;
  const p=eExpo(P(t,a,a+0.4)); svc.style.opacity=p; svc.style.transform=`translate(-50%,-50%) translateY(${lerp(40,0,p)}px)`;
  q.forEach((e,i)=>punch(e,t,a+0.25+i*0.12,1e9,1.3));
  const b=eBack(P(t,a+0.75,a+1.05)); btn.style.opacity=clamp(b); btn.style.transform=`translate(-50%,0) scale(${b*(1+0.02*Math.sin((t-a)*6)*P(t,a+1.2,a+1.5))})`;
  const rp=((t-a-1.3)%1.2+1.2)%1.2/1.2; const on=t>a+1.3; ring.style.opacity=on?(1-rp)*0.6:0; ring.style.transform=`translate(-50%,0) scale(${1+rp*0.12},${1+rp*0.35})`;
  const bp=eExpo(P(t,a+1.1,a+1.5)); brandBox.style.opacity=bp; brandBox.style.transform=`translateY(${lerp(30,0,bp)}px)`;
  ctaLines.forEach((l,i)=>l.setAttribute('opacity',0.07*eCubic(P(t,a+i*0.02,a+0.4+i*0.02))));
}

/* =====================================================================
   MASTER RENDER
   ===================================================================== */
const SCENES = [
  [Lhook, T.hook, T.stop, renderHook],
  [Lstop, T.stop, T.before, renderStop],
  [Ldesk, T.before, T.turnMorph, (t)=>{ renderDesk(t, T.turn-0.001);
      const fz=P(t,T.turn,T.turn+0.01); Ldesk.style.filter = t>=T.turn?'grayscale(1) brightness(.75)':''; Ldesk.style.transform=t>=T.turn?`scale(${1+0.03*P(t,T.turn,T.turnMorph)})`:''; }],
  [Lturn, T.turnMorph, T.after, renderTurn],
  [Lflow, T.after, T.result+0.2, renderFlow],
  [Ldash, T.gather, T.compare, renderDash],
  [Lcmp, T.compare, T.core, renderCmp],
  [Lcore, T.core, T.cta, renderCore],
  [Lcta, T.cta, T.end+1, renderCta],
];
function render(t){
  Lflow.style.zIndex=5; Ldash.style.zIndex=4;
  for(const [L,a,b,fn] of SCENES){ const on=t>=a&&t<b; L.style.display=on?'block':'none'; if(on) fn(t); }
  // Turn 시작 시 선 레이어가 데스크톱에서 넘어오는 순간: 창 페이드
  if(t>=T.turnMorph && t<T.turnMorph+0.3){ Ldesk.style.display='block'; renderDesk(T.turn-0.001, T.turn-0.001); Ldesk.style.filter='grayscale(1) brightness(.75)'; Ldesk.style.opacity=1-P(t,T.turnMorph,T.turnMorph+0.3); lineSvg.style.opacity=0; }
  else { Ldesk.style.opacity=1; lineSvg.style.opacity=1; }
  // 컷 전환 플래시 (구조 전환점)
  flash.style.opacity = t>=T.turnText&&t<T.turnText+0.12 ? 0.35*(1-P(t,T.turnText,T.turnText+0.12)) : 0;
}
render(0);
window.render = render; window.CUES = CUES; window.DURATION = C.duration || T.end;

/* 미리보기: 브라우저에서 열면 자동 재생 (렌더링 시에는 ?render=1) */
if(!location.search.includes('render')){
  const fit=()=>{const s=Math.min(innerWidth/W, innerHeight/H); stage.style.transform=`scale(${s})`; document.body.style.height=innerHeight+'px';};
  fit(); addEventListener('resize',fit);
  const au = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null; let st=null;
  const loop=(now)=>{ if(st==null) st=now; const t=((now-st)/1000)%window.DURATION; render(t); requestAnimationFrame(loop); };
  document.addEventListener('click',()=>{ st=null; if(au){au.currentTime=0; au.play();} });
  requestAnimationFrame(loop);
}
</script>
