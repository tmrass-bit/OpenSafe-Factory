<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Shortform Engine</title>
<style>
  :root { --ai:#4F8CFF; --human:#F5A524; --exc:#FF5A5F; --ok:#34C759; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#000; overflow:hidden; }
  body { font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#000; transform-origin:0 0; }
  .layer { position:absolute; inset:0; display:none; }
  .abs { position:absolute; }
  .txt { position:absolute; left:540px; white-space:nowrap; font-weight:900; letter-spacing:-0.035em; line-height:1.12; text-align:center; will-change:transform,opacity; }

  /* ---------- notifications ---------- */
  .noti { position:absolute; width:820px; height:150px; border-radius:34px; background:rgba(242,242,247,.96);
          display:flex; align-items:center; gap:26px; padding:0 30px; color:#111; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .ic { width:82px; height:82px; border-radius:20px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:30px; }
  .ic-kakao { background:#FEE500; color:#3A1D1D; } .ic-mail { background:#1E88FF; color:#fff; }
  .ic-excel { background:#107C41; color:#fff; font-size:44px; } .ic-inquiry { background:#7B61FF; color:#fff; font-size:46px; }
  .ic-memo { background:#FF9F0A; color:#fff; }
  .nb { flex:1; min-width:0; }
  .nh { display:flex; justify-content:space-between; font-size:24px; color:#6b6b70; font-weight:500; }
  .nt { font-size:33px; font-weight:700; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nd { font-size:29px; color:#3c3c43; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- desktop windows ---------- */
  .win { position:absolute; background:rgba(24,24,27,.86); border:2px solid #2E2E33; border-radius:24px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .win.active { border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.6); }
  .tb { height:58px; background:#242428; display:flex; align-items:center; padding:0 20px; gap:10px; position:relative; }
  .tb i { width:16px; height:16px; border-radius:50%; display:block; }
  .tb span { position:absolute; left:0; right:0; text-align:center; font-size:25px; color:#b5b5bb; font-weight:700; }
  .bub { background:#2C2C30; border-radius:22px; padding:14px 22px; font-size:28px; margin:14px 20px 0 76px; position:relative; width:fit-content; max-width:360px; }
  .bub::before { content:''; position:absolute; left:-60px; top:4px; width:46px; height:46px; border-radius:16px; background:#3d3d44; }
  .row { display:flex; align-items:center; gap:14px; height:82px; padding:0 22px; border-bottom:1px solid #26262a; font-size:26px; }
  .row b { width:112px; flex:none; font-weight:700; } .row em { font-style:normal; color:#9a9aa1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .row .dot { width:12px; height:12px; border-radius:50%; background:#1E88FF; flex:none; }
  .search { margin:16px 20px; height:58px; border-radius:14px; background:#26262B; display:flex; align-items:center; padding:0 18px; font-size:26px; color:#ddd; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); font-size:23px; }
  .grid div { height:62px; border-right:1px solid #2a2a2e; border-bottom:1px solid #2a2a2e; display:flex; align-items:center; padding:0 10px; color:#c9c9cf; overflow:hidden; white-space:nowrap; }
  .grid .h { background:#107C41; color:#fff; font-weight:700; }
  .memo { padding:24px 30px; font-size:34px; line-height:1.75; color:#e6e6e6; font-weight:500; }
  .memo p { position:relative; width:fit-content; }
  .memo .mk { position:absolute; left:-6px; right:-6px; bottom:6px; height:22px; background:rgba(245,165,36,.45); transform-origin:left; z-index:-1; }
  .qm { position:absolute; font-size:84px; font-weight:900; color:var(--human); }
  .counter { position:absolute; left:540px; top:92px; transform:translate(-50%,-50%); background:#2a0f10; border:2px solid #FF5A5F;
             color:#fff; border-radius:60px; padding:14px 34px; font-size:36px; font-weight:700; white-space:nowrap; }
  .counter b { color:#FF5A5F; font-weight:900; font-size:44px; margin-left:10px; }
  .chip-fly { position:absolute; background:#1E88FF; color:#fff; font-weight:700; font-size:26px; padding:10px 18px; border-radius:12px; white-space:nowrap; }
  .keycap { position:absolute; background:#fff; color:#000; font-weight:900; font-size:30px; padding:8px 18px; border-radius:12px; white-space:nowrap; }
  .band { position:absolute; left:0; right:0; }

  /* ---------- flow ---------- */
  .node { position:absolute; transform:translate(-50%,-50%); background:#141418; border:2px solid #3a3a40; border-radius:28px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .node .l { font-size:44px; font-weight:900; } .node .s { font-size:26px; color:#9a9aa1; margin-top:4px; }
  .lane { position:absolute; transform:translate(-50%,-50%); width:310px; height:150px; border-radius:26px; background:#101014;
          border:3px solid; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .lane .l { font-size:40px; font-weight:900; white-space:nowrap; } .lane .s { font-size:25px; color:#a8a8ae; margin-top:2px; }
  .lane .c { position:absolute; top:-22px; right:-16px; min-width:52px; height:52px; border-radius:26px; font-size:30px; font-weight:900; color:#000;
             display:flex; align-items:center; justify-content:center; padding:0 12px; }
  /* chaos: 과부하 몽타주 */
  .xw .bd i { display:block; height:16px; border-radius:8px; background:rgba(255,255,255,.1); margin:22px 24px 0; }
  .bdg { position:absolute; min-width:40px; height:40px; padding:0 12px; border-radius:20px; background:#FF3B45; color:#fff; font-size:24px; font-weight:900;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(255,59,69,.5); z-index:3; }
  .spill { position:absolute; top:156px; transform:translate(-50%,-50%); height:44px; padding:0 18px; border-radius:22px; font-size:24px; font-weight:800;
    display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .spill b { font-weight:900; font-size:28px; }
  /* compare: 같은 프레임 · 다른 상태 */
  .cframe { position:absolute; border-radius:34px; overflow:hidden; }
  .cframe.messy { background:#150a0b; border:2px solid #3d1c1f; }
  .cframe.clean { background:#0a1426; border:2px solid #22406e; }
  .mw { position:absolute; background:#1c1c20; border:2px solid #34343a; border-radius:16px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.65); }
  .mw .mt { height:36px; background:#27272c; display:flex; align-items:center; gap:6px; padding:0 12px; font-size:17px; color:#aaa; font-weight:700; white-space:nowrap; overflow:hidden; }
  .mw .mt i { width:10px; height:10px; border-radius:50%; display:block; flex:none; }
  .mw .mt span { margin-left:8px; overflow:hidden; text-overflow:ellipsis; }
  .sk { height:12px; border-radius:6px; background:rgba(255,255,255,.12); margin:16px 16px 0; }
  .cstrip { position:absolute; left:24px; right:24px; top:22px; height:52px; display:flex; gap:12px; }
  .cst { flex:1; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:21px; font-weight:800; white-space:nowrap; }
  .cst b { font-size:26px; font-weight:900; }
  .lhd { position:absolute; top:96px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#fff; }
  .ccard { position:absolute; height:60px; border-radius:14px; background:#10203a; border:2px solid; padding:0 14px; display:flex; flex-direction:column; justify-content:center; gap:9px; }
  .ccard i { display:block; height:10px; border-radius:5px; background:rgba(255,255,255,.2); }
  .ccard i + i { width:55%; background:rgba(255,255,255,.1); }
  .cbar { position:absolute; left:24px; right:24px; bottom:24px; height:64px; border-radius:16px; display:flex; align-items:center; padding:0 22px; gap:16px; font-size:21px; font-weight:800; }
  .cbar .tr { flex:1; height:16px; border-radius:8px; overflow:hidden; display:flex; background:#1d1d22; }
  /* turn: 분해 조각 · 모듈 */
  .ghost { position:absolute; border-radius:22px; background:linear-gradient(180deg,rgba(70,70,80,.92),rgba(44,44,52,.92)); border:2px solid rgba(255,255,255,.26); overflow:hidden; box-shadow:0 30px 60px rgba(0,0,0,.45); }
  .ghost b { display:block; height:44px; background:rgba(255,255,255,.07); margin-bottom:10px; }
  .ghost i { display:block; height:14px; border-radius:7px; background:rgba(255,255,255,.12); margin:16px 22px 0; }
  .mod { position:absolute; border-radius:28px; background:linear-gradient(180deg,#1b1b21,#121216); border:2px solid #fff; overflow:hidden;
    box-shadow:0 28px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
  .mod.lane { border-radius:26px; } .mod.drop { border-radius:22px; border-style:dashed; }
  .mod .ml { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .mod .l { font-size:42px; font-weight:900; white-space:nowrap; letter-spacing:-0.02em; } .mod .s { font-size:24px; color:#a8a8ae; margin-top:4px; white-space:nowrap; }
  .mod .b { opacity:0; }
  .mod .sw { position:absolute; top:-20%; bottom:-20%; width:34%; left:0; background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22),rgba(255,255,255,0)); opacity:0; }
  .chip { position:absolute; left:0; top:0; width:290px; height:60px; border-radius:16px; background:#2A2A2F; border:2px solid #55555c;
          display:flex; align-items:center; gap:12px; padding:0 14px; font-size:27px; font-weight:700; white-space:nowrap; will-change:transform; }
  .chip .tg { font-size:19px; font-weight:900; padding:3px 9px; border-radius:8px; color:#000; background:#888; }

  /* ---------- dashboard ---------- */
  .dash { position:absolute; left:60px; top:380px; width:960px; height:1390px; background:#0F0F12; border:2px solid #2a2a30; border-radius:44px; padding:56px 60px; }
  .dh { display:flex; justify-content:space-between; align-items:center; }
  .dh .t { font-size:46px; font-weight:900; } .dh .live { font-size:28px; color:var(--ok); font-weight:700; }
  .kpis { display:flex; gap:30px; margin-top:44px; }
  .kpi { width:260px; height:220px; border-radius:28px; background:#16161b; border:2px solid #26262c; padding:26px; }
  .kpi .kl { font-size:28px; color:#a8a8ae; font-weight:700; } .kpi .kv { font-size:100px; font-weight:900; line-height:1.15; }
  .sbar { margin-top:38px; height:24px; border-radius:12px; background:#1d1d22; display:flex; overflow:hidden; }
  .sbar div { height:100%; }
  .rv-t { font-size:34px; font-weight:900; margin-top:52px; margin-bottom:10px; }
  .rv { display:flex; align-items:center; gap:22px; height:112px; border-bottom:1px solid #222228; font-size:31px; font-weight:500; }
  .av { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:28px; color:#000; flex:none; }
  .pill { margin-left:auto; font-size:24px; font-weight:900; padding:8px 18px; border-radius:30px; border:2px solid; white-space:nowrap; }
  .pend { position:absolute; left:60px; right:60px; bottom:56px; height:190px; border-radius:30px; background:#0c1f12; border:2px solid #1f5c30;
          display:flex; align-items:center; justify-content:space-between; padding:0 44px; }
  .pend .pl { font-size:38px; font-weight:700; } .pend .pv { font-size:104px; font-weight:900; color:var(--ok); }

  /* ---------- compare / cta ---------- */
  .panel { position:absolute; left:0; width:1080px; height:960px; overflow:hidden; }
  .tag { display:inline-block; font-size:34px; font-weight:900; letter-spacing:.12em; padding:10px 26px; border-radius:40px; }
  .svc { position:absolute; left:540px; transform:translate(-50%,-50%); border:2px solid #444; border-radius:60px; padding:18px 40px; font-size:44px; font-weight:700; color:#d8d8dc; white-space:nowrap; }
  .btn { position:absolute; left:540px; width:900px; height:156px; border-radius:80px; background:#fff; color:#000; display:flex; align-items:center; justify-content:center;
         font-size:56px; font-weight:900; white-space:nowrap; letter-spacing:-0.03em; }
  .ring { position:absolute; left:540px; width:900px; height:156px; border-radius:80px; border:4px solid #fff; }
  .logo-ph { width:120px; height:120px; border-radius:30px; border:3px dashed #666; display:flex; align-items:center; justify-content:center; color:#777; font-size:26px; font-weight:900; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* =====================================================================
   SHORTFORM ENGINE  —  window.CONFIG 를 받아 render(t) 로 매 프레임을 그린다.
   구조(장면 순서·연출)는 이 파일, 내용(문구·데이터)은 episodes/<에피소드>/config.json
   ===================================================================== */
const C = window.CONFIG;
const W = 1080, H = 1920;
// 타임라인은 "박자(beat)" 단위로 정의 → 화면 전환·카드·텍스트·음악이 같은 박자 격자 위에 놓인다.
// config.bpm 으로 템포, config.timeline 으로 개별 값(초 단위) 덮어쓰기.
const BPM = C.bpm || 110, BT = 60 / BPM;
const TB = {
  hook:0, hookLine2:1.5, stop:3, stopHit:3.5, before:5, chaos:10, ramp:12.75, turn:13,
  turnMorph:13.5, reveal:14, snap:17, assemble:18.5, turnText:19, turnOut:21, after:22,
  afterWords:[22.5,24.5,26.5], chipStart:22.5, gather:30, result:31, compare:33.5, cmpAfter:34.5,
  core:36.5, core2:38, cta:40
};
const T = {};
for (const k in TB) T[k] = Array.isArray(TB[k]) ? TB[k].map(v => v * BT) : TB[k] * BT;
Object.assign(T, { beat: BT, chipGap: BT / 2, revealGap: BT / 2, snapGap: BT / 4, end: C.duration || 25 }, C.timeline || {});
const LANE_COLOR = {}; C.after.lanes.forEach(l => LANE_COLOR[l.key] = l.color);
const LANE_IDX = {}; C.after.lanes.forEach((l,i) => LANE_IDX[l.key] = i);

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eCubic=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(20260925);
const stage = document.getElementById('stage');
function mk(tag, cls, parent, html){const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; (parent||stage).appendChild(e); return e;}
function layer(){const l=mk('div','layer'); l.style.display='block'; return l;}
function svgEl(tag, attrs, parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e;}
function svgLayer(parent){return svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,style:'position:absolute;left:0;top:0;overflow:visible'},parent);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// 큰 글씨: 가로폭에 맞춰 자동 축소
function bigText(parent, text, y, size, maxW=980, color='#fff'){
  const e=mk('div','txt',parent,text); e.style.top=y+'px'; e.style.color=color; e.style.fontSize=size+'px';
  e.style.visibility='hidden'; e.style.display='block';
  let s=size; while(e.offsetWidth>maxW && s>30){s-=2; e.style.fontSize=s+'px';}
  e.style.visibility=''; e.style.opacity=0; return e;
}
function setTx(e,{x=0,y=0,s=1,o=1,r=0}={}){e.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; e.style.opacity=o;}
// 박자에 맞춰 "쾅" 들어오는 글자
function punch(e,t,t0,t1=1e9,from=1.35){
  if(t<t0||t>=t1){e.style.opacity=0;return;}
  const p=eExpo(P(t,t0,t0+0.3)); setTx(e,{s:lerp(1+(from-1)*0.3,1,p), y:lerp(18,0,p), o:P(t,t0,t0+0.07)});
}
const CUES = {hits:[], words:[], clicks:[], whoosh:[], ticks:[], silence:[], chipLand:[], tonal:[], snaps:[], mag:[]};

/* ---------- 실사 배경: render.js 가 클립에서 프레임을 뽑아 window.BG[key] 로 넘겨줌 ---------- */
const BG = window.BG || {}, bgImgsAll = [];
function bgLayer(parent, key){
  const B = BG[key], imgs = [];
  if (!B || !B.count) return { draw(){}, on:false };
  for (let i = 0; i < B.count; i++) { const im = new Image(); im.src = B.base + String(i + 1).padStart(3, '0') + '.jpg'; imgs.push(im); bgImgsAll.push(im); }
  const cv = mk('canvas', 'abs', parent); cv.width = W; cv.height = H; Object.assign(cv.style, {left:0, top:0, width:W+'px', height:H+'px', zIndex:0});
  const ctx = cv.getContext('2d');
  const d = B.dim != null ? B.dim : 0.5;
  const shade = mk('div', 'abs', parent); Object.assign(shade.style, {inset:0, zIndex:0,
    background:`radial-gradient(ellipse at 50% 45%,rgba(0,0,0,${d*0.7}) 0%,rgba(0,0,0,${Math.min(1,d+0.3)}) 100%),linear-gradient(180deg,rgba(8,10,20,.35),rgba(0,0,0,0) 40%,rgba(0,0,0,.4))`});
  return { on:true, cv, shade, draw(tl, s=1){
    const im = imgs[Math.min(imgs.length - 1, Math.max(0, Math.floor(tl * (B.fps || 30))))];
    if (!im || !im.complete || !im.naturalWidth) return;
    const w = W * s, h = H * s; ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  } };
}

/* =====================================================================
   1) HOOK — 알림 폭탄
   ===================================================================== */
const Lhook = layer();
const hookBg = bgLayer(Lhook, 'hook');
function renderHookBg(t){ hookBg.draw(t - T.hook, 1.1 - 0.06 * eCubic(P(t, 0, T.stop))); }   // 알림 줌과 반대 방향으로 천천히 당김 (패럴랙스)
const ICON = {kakao:'TALK', mail:'✉', excel:'X', inquiry:'?', memo:'≡'};
const notis = C.hook.notifications.map((n,i)=>{
  const e=mk('div','noti',Lhook,`<div class="ic ic-${n.app}">${ICON[n.app]||'•'}</div><div class="nb"><div class="nh"><span>${esc(n.name)}</span><span>지금</span></div><div class="nt">${esc(n.title)}</div><div class="nd">${esc(n.body)}</div></div>`);
  const slots=[160,1480,420,1260,700,1640,300,1080,1560,560,1380,220,1180,860];
  return {e, t0:-0.4+i*T.beat/4, x:130+(R()-.5)*120, y:slots[i%slots.length]+(R()-.5)*60, r:(R()-.5)*9};
});
notis.forEach((n,i)=>{if(n.t0>0 && i%2===0) CUES.ticks.push(n.t0);});   // 알림음은 8분음표마다만 (UI 사운드 절제)
const hookShade = mk('div','band',Lhook); Object.assign(hookShade.style,{top:'620px',height:'700px',background:'linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.88) 25%,rgba(0,0,0,.88) 75%,rgba(0,0,0,0))'});
const hook1 = bigText(Lhook, esc(C.hook.lines[0]), 880, 122);
const hook2 = bigText(Lhook, esc(C.hook.lines[1]), 1045, 122);
CUES.hits.push({t:0,k:'stab'}, {t:T.hookLine2,k:'stab'});
function renderHook(t){
  renderHookBg(t);
  const z=1+0.05*P(t,0,1.5);
  notis.forEach((n,i)=>{
    if(t<n.t0){n.e.style.opacity=0;return;}
    const p=eExpo(P(t,n.t0,n.t0+0.22));
    n.e.style.left=n.x+'px'; n.e.style.top=n.y+'px';
    const shake = (t-n.t0<0.12)? Math.sin((t-n.t0)*160)*6 : 0;
    n.e.style.transform=`translate(0,${lerp(-140,0,p)}px) scale(${lerp(1.18,1,p)*z}) rotate(${n.r+shake*0.2}deg)`;
    n.e.style.opacity=clamp(P(t,n.t0,n.t0+0.06))*(1-0.25*P(t,n.t0+0.6,n.t0+1.2));
    n.e.style.zIndex=i;
  });

  return {e, cx, cy, z:[-420,160,-260,60,-120,240,-360,120,-60,-300,200,-200][i%12], ox:(cx-540)*0.14, oy:(cy-900)*0.1};
});
// (b) 모듈: AFTER 흐름도의 노드/레인과 같은 크기·위치로 만들어 두고, 분해 상태에선 축소·오프셋

const L3 = C.after.lanes;
const MT = [ // 목표(조립) 위치 · 크기 · 강조색 · 모프 후 라벨
  {x:NODE_IN.x, y:NODE_IN.y, w:480, h:124, col:'#E8E8EC', kind:'node', to:[C.after.input,'']},
  {x:NODE_CL.x, y:NODE_CL.y, w:520, h:150, col:'#FFFFFF', kind:'node', to:[C.after.classifier, C.after.classifierSub]},
  {x:LX[0], y:LANE_Y, w:310, h:150, col:L3[0].color, kind:'lane', to:[L3[0].label, L3[0].sub]},
  {x:LX[1], y:LANE_Y, w:310, h:150, col:L3[1].color, kind:'lane', to:[L3[1].label, L3[1].sub]},
  {x:LX[2], y:LANE_Y, w:310, h:150, col:L3[2].color, kind:'lane', to:[L3[2].label, L3[2].sub]},
  {x:LX[2], y:LANE_Y+190, w:310, h:110, col:L3[2].color, kind:'drop', to:['','']},
];
const SRC = [2,0,1,4,6,5];   // 각 모듈이 빠져나오는 분해 조각 (목표 위치와 먼 조각 → 스냅 이동이 보이게)
const MD = MODS.slice(0,6).map((m,i)=>{
  const t=MT[i], g=GH[SRC[i]%GH.length];
  const e=mk('div','mod '+t.kind,world,`<div class="ml a"><div class="l">${esc(m.label)}</div>${m.sub?`<div class="s">${esc(m.sub)}</div>`:''}</div>`+
    `<div class="ml b"><div class="l">${esc(t.to[0])}</div>${t.to[1]?`<div class="s">${esc(t.to[1])}</div>`:''}</div><div class="sw"></div>`);
  Object.assign(e.style,{left:t.x+'px',top:t.y+'px',width:t.w+'px',height:t.h+'px'});
  const rv=T.reveal+i*T.revealGap, land=T.snap+i*T.snapGap;
  CUES.tonal.push({t:rv, n:i}); CUES.snaps.push(land);
  return {e, t, g, rv, land, a:e.querySelector('.a'), b:e.querySelector('.b'), sw:e.querySelector('.sw')};
});
// (c) 연결선: AFTER 흐름도와 동일한 경로
const tSvg = svgLayer(world); tSvg.style.transform='translateZ(-1px)';
const tTrunk = svgEl('path',{d:trunkD,stroke:'#fff','stroke-width':4,fill:'none'},tSvg);
const tBr = L3.map((l,i)=>svgEl('path',{d:branchD(i),stroke:l.color,'stroke-width':5,fill:'none','stroke-linecap':'round'},tSvg));
const tDrop = svgEl('path',{d:`M${LX[2]},${LANE_Y+75} L${LX[2]},${LANE_Y+135}`,stroke:L3[2].color,'stroke-width':4,fill:'none'},tSvg);
const CONN = [tTrunk,...tBr,tDrop];
CUES.silence.push([T.turn, T.turnMorph]);
CUES.mag.push(T.assemble); CUES.hits.push({t:T.turnText,k:'impact'}, {t:T.turnText,k:'bloom'});

function renderTurn(t){
  const B=T.beat;
  // 카메라: 분해 시 비스듬히 기울어진 입체 → 스냅 전에 정면으로 평탄화 → 완성 후 푸시인 → 모프 전에 원위치
  const ex = eInOut(P(t,T.turnMorph,T.turnMorph+0.5*B));            // 분해
  const flat = eInOut(P(t,T.snap-0.5*B,T.snap+0.25*B));             // 정면화
  const drift = P(t,T.turnMorph,T.snap);                             // 느린 패럴랙스 드리프트
  const rx = lerp(0,16,ex)*(1-flat), ry = (lerp(0,-18,ex)+6*drift)*(1-flat);
  const push = eInOut(P(t,T.turnText,T.turnOut))*(1-eInOut(P(t,T.turnOut,T.after)));
  const sc = lerp(1,0.92,ex*(1-flat)) * (1+0.05*push);
  world.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`;
  // 분해 조각: 깊이별로 흩어졌다가, 모듈이 빠져나가며 사라짐
  GH.forEach((g,i)=>{
    const src = MD.find(m=>m.g===g);
    const fade = src ? P(t,src.rv,src.rv+0.5*B) : P(t,T.snap-0.5*B,T.snap+0.5*B);
    g.e.style.transform = `translate3d(${g.ox*ex}px,${g.oy*ex}px,${g.z*ex - 200*fade}px)`;
    g.e.style.opacity = t<T.turnMorph ? 0 : 0.9*(1-fade);
  });
  // 모듈
  MD.forEach((m,i)=>{
    const shown = P(t,m.rv,m.rv+0.35*B);                           // 등장 (조각에서 앞으로 빠져나옴)
    const fl = P(t,m.land-0.4*B,m.land), fp = eExpo(fl);           // 스냅 비행 → 정확한 박자에 착지
    const gx = m.g.cx + m.g.ox*ex - m.t.x, gy = m.g.cy + m.g.oy*ex - m.t.y;
    const dx = lerp(gx,0,fp), dy = lerp(gy,0,fp), dz = lerp(m.g.z*ex + 180*eCubic(shown), 0, fp);
    const s0 = 0.72;
    let s = lerp(s0, 1, fp);
    const settle = P(t,T.assemble,T.assemble+0.5*B); s *= 1 + 0.02*Math.sin(Math.PI*settle);      // 조립: 맞물림
    m.e.style.transform = `translate(-50%,-50%) translate3d(${dx}px,${dy}px,${dz}px) scale(${s})`;
    m.e.style.opacity = t<m.rv ? 0 : clamp(shown*1.6);
    const v = fl>0&&fl<1 ? (1-fp) : 0;                                 // 비행 중에만 모션 블러
    m.e.style.filter = v>0.05 ? `blur(${5*v}px)` : '';
    m.e.style.borderColor = m.t.col;
    // 완성 순간 한 번 지나가는 빛 (왼쪽 → 오른쪽, 위치에 따라 순차)
    const sp = P(t, T.turnText + (m.t.x/1080)*0.3*B, T.turnText + (m.t.x/1080)*0.3*B + 0.8*B);
    m.sw.style.transform = `translateX(${lerp(-140,260,sp)}%) skewX(-18deg)`; m.sw.style.opacity = sp>0&&sp<1 ? 1 : 0;
    // 모프: 모듈 라벨 → AFTER 라벨, 모듈 스타일 → 흐름도 스타일
    const mo = eInOut(P(t,T.turnOut+0.2*B,T.after-0.2*B));
    m.a.style.opacity = 1-mo; m.b.style.opacity = mo;
    if(m.t.kind==='drop'){ m.e.style.transform += ` translateY(${-190*mo}px)`; m.e.style.opacity = parseFloat(m.e.style.opacity)*(1-mo); }
  });
  // 연결선: 조립 박자에 맞춰 뻗어 나감
  CONN.forEach((c,i)=>{ if(!c._len) c._len=c.getTotalLength(); const p=eCubic(P(t,T.assemble+i*0.06*B,T.assemble+0.5*B+i*0.06*B));
    c.setAttribute('stroke-dasharray',c._len); c.setAttribute('stroke-dashoffset',c._len*(1-p)); c.setAttribute('opacity', i===CONN.length-1 ? 1-eInOut(P(t,T.turnOut,T.after)) : 1); });
  // 랙 포커스: 카피가 뜨는 동안 구조는 한 단계 뒤로 (흐림·어둡게), 모프 직전 다시 선명하게
  const foc = eInOut(P(t,T.turnText+0.25*B,T.turnText+0.75*B))*(1-eInOut(P(t,T.turnOut,T.turnOut+0.5*B)));
  world.style.filter = foc>0.01 ? `blur(${3.5*foc}px) brightness(${1-0.55*foc})` : '';
  if(t>=T.turnText+0.25*B){ const p=eExpo(P(t,T.turnText+0.25*B,T.turnText+0.9*B)), o=1-P(t,T.turnOut,T.turnOut+0.5*B);
    setTx(turnTxt,{s:lerp(1.05,1,p)*(1+0.03*push), y:lerp(24,0,p)-30*(1-o), o:clamp(p*1.5)*o}); } else turnTxt.style.opacity=0;
}

/* =====================================================================
   5) AFTER — 문의 카드가 세 갈래로 슉슉
   ===================================================================== */
const Lflow = layer();
const flowWrap = mk('div','abs',Lflow); Object.assign(flowWrap.style,{inset:0});
const fSvg = svgLayer(flowWrap);
const nIn = mk('div','node',flowWrap,`<div class="l">${esc(C.after.input)}</div>`); Object.assign(nIn.style,{left:NODE_IN.x+'px',top:NODE_IN.y+'px',width:'480px',height:'124px'});
const nCl = mk('div','node',flowWrap,`<div class="l">${esc(C.after.classifier)}</div><div class="s">${esc(C.after.classifierSub)}</div>`); Object.assign(nCl.style,{left:NODE_CL.x+'px',top:NODE_CL.y+'px',width:'520px',height:'150px'});
const trunkIn = svgEl('path',{d:`M540,-40 L540,${NODE_IN.y-62}`,stroke:'#fff','stroke-width':3,opacity:.35,fill:'none','stroke-dasharray':'8 14'},fSvg);
const trunk = svgEl('path',{d:trunkD,stroke:'#fff','stroke-width':4,fill:'none'},fSvg);
const branches = C.after.lanes.map((l,i)=>{
  const p=svgEl('path',{d:branchD(i),stroke:l.color,'stroke-width':5,fill:'none','stroke-linecap':'round'},fSvg);
  return p;
});
const laneEls = C.after.lanes.map((l,i)=>{const e=mk('div','lane',flowWrap,`<div class="l">${esc(l.label)}</div><div class="s">${esc(l.sub)}</div><div class="c" style="background:${l.color}">0</div>`);
  Object.assign(e.style,{left:LX[i]+'px',top:LANE_Y+'px',borderColor:l.color,boxShadow:`0 0 0 0 ${l.color}`}); e.cnt=e.querySelector('.c'); return e;});
const flowWords = C.after.words.map(w=>bigText(Lflow, esc(w), 250, 128));
const TAG = {ai:'AI', human:'사람', exception:'전달'};
// chips
const laneCount=[0,0,0];
const CH_LAND = 1.5*T.beat, CH_K = CH_LAND/0.72;   // 원래 0.72초 동작을 1.5박에 맞춰 늘림
const CHIPS = C.after.items.map((it,i)=>{
  const li = LANE_IDX[it.lane]; const slot = laneCount[li]++;
  const e = mk('div','chip',flowWrap,`<span class="tg">${TAG[it.lane]||''}</span><span>${esc(it.text)}</span>`);
  const t0 = T.chipStart + i*T.chipGap;
  CUES.chipLand.push({t:t0+CH_LAND, lane:li});
  return {e, it, li, slot, t0, tg:e.querySelector('.tg')};
});
function chipPos(c,t){
  const s=(t-c.t0)/CH_K; const lx=LX[c.li]; const sy=SLOT_Y+c.slot*SLOT_GAP;
  const br=branches[c.li]; if(!br._len) br._len=br.getTotalLength();
  if(s<0.2){const p=eCubic(s/0.2); return [540, lerp(-60,NODE_IN.y,p), 0];}
  if(s<0.26) return [540, NODE_IN.y, 0];
  if(s<0.4){const p=eInOut((s-0.26)/0.14); return [540, lerp(NODE_IN.y,NODE_CL.y,p), 0];}
  if(s<0.46) return [540, NODE_CL.y, 1];
  if(s<0.62){const p=eInOut((s-0.46)/0.16); const pt=br.getPointAtLength(br._len*p); return [pt.x,pt.y,1];}
  if(s<0.72){const p=eCubic((s-0.62)/0.1); return [lx, lerp(LANE_Y-75,sy,p), 1];}
  return [lx, sy, 1];
}
function renderFlow(t){
  flowWrap.style.transform='';
  const a=T.after;
  // nodes
  setTx(nIn,{s:1,o:1}); setTx(nCl,{s:1,o:1});
  trunk.setAttribute('opacity',1); trunkIn.setAttribute('opacity',0.35*P(t,a,a+0.5*T.beat));
  trunkIn.setAttribute('stroke-dashoffset', -t*120);

  // emphasis
  const w=T.afterWords; let focus=-1;
  if(t>=w[1]&&t<w[2]) focus=LANE_IDX.human; else if(t>=w[2]&&t<T.gather-0.1) focus=LANE_IDX.ai;
  const fStart = focus===LANE_IDX.human ? w[1] : w[2], fp = eInOut(P(t,fStart,fStart+0.5*T.beat));
  laneEls.forEach((e,i)=>{const f= focus===i;
    setTx(e,{s:f?lerp(1,1.06,fp):1,o:(focus>=0&&!f?0.45:1)});   // 랙 포커스: 해당 레인만 선명
    e.style.boxShadow = 'none';
    e.style.background = f? C.after.lanes[i].color+'33' : '#101014';
    const n=CHIPS.filter(c=>c.li===i && t>=c.t0+CH_LAND).length; e.cnt.textContent=n; });
  branches.forEach((b,i)=>b.setAttribute('opacity', focus>=0&&focus!==i?0.3:1));
  // classifier pulse on each chip
  // 분류 노드: 카드가 지나갈 때 테두리 색만 바뀜 (글로우 반복 없음)
  let pc='#3a3a40'; CHIPS.forEach(c=>{const s=(t-c.t0)/CH_K; if(s>=0.38&&s<0.5) pc=LANE_COLOR[c.it.lane];});
  nCl.style.borderColor = pc; nCl.style.boxShadow = 'none';
  let pin2=0; CHIPS.forEach(c=>{const s=(t-c.t0)/CH_K; if(s>=0.18&&s<0.3) pin2=1;}); nIn.style.borderColor=pin2?'#fff':'#3a3a40';
  // chips
  CHIPS.forEach(c=>{
    if(t<c.t0){c.e.style.opacity=0;return;}
    const [x,y,cls]=chipPos(c,t);
    let gx=x, gy=y, sc=1, op=1;
    // gather → 대시보드 KPI 로 빨려 들어감
    if(t>=T.gather){const g=eInOut(P(t,T.gather+c.li*0.04+c.slot*0.015,T.gather+0.42+c.li*0.04)); gx=lerp(x,KPI_C[c.li][0],g); gy=lerp(y,KPI_C[c.li][1],g); sc=lerp(1,0.3,g); op=1-P(g,0.75,1);}
    c.e.style.transform=`translate(${gx-145}px,${gy-30}px) scale(${sc})`; c.e.style.opacity=op;
    const col=LANE_COLOR[c.it.lane];
    c.e.style.borderColor = cls? col : '#55555c'; c.e.style.background = cls? '#15151a':'#2A2A2F';
    c.tg.style.background = cls? col : '#666'; c.tg.style.display = cls?'':'none';
    c.e.style.zIndex=20;
  });
  // words
  flowWords.forEach((e,i)=>{punch(e,t,w[i],i<w.length-1?w[i+1]:T.gather,1.4);});
  // gather: 흐름 다이어그램 퇴장
  const g=P(t,T.gather,T.gather+0.3);
  [nIn,nCl,...laneEls].forEach(e=>{e.style.opacity=parseFloat(e.style.opacity||1)*(1-g);});
  fSvg.style.opacity=1-g;
}
C.after.words.forEach((w,i)=>CUES.hits.push({t:T.afterWords[i],k:'word'}));

}

/* =====================================================================

   같은 사람 · 같은 구도(매치 컷). 사람에게 붙어 있던 업무 조각 3개가

const Lcmp = layer();
const cmpBgB = bgLayer(Lcmp, 'compare.before'), cmpBgA = bgLayer(Lcmp, 'compare.after');
const cmpTint = mk('div','abs',Lcmp); Object.assign(cmpTint.style,{inset:0});
const cmpFoot = mk('div','abs',Lcmp); Object.assign(cmpFoot.style,{left:0,right:0,bottom:0,height:'720px',background:'linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.82) 55%)'});
// 외부 업무 보드 (벽면 화이트보드) — 3-lane 흐름도와 다른 밝은 실물 보드
const BD = {x:596, y:150, w:452, h:520}, ROW = 150;
const board = mk('div','abs',Lcmp); Object.assign(board.style,{left:BD.x+'px',top:BD.y+'px',width:BD.w+'px',height:BD.h+'px',borderRadius:'18px',
  background:'rgba(246,247,249,.96)',border:'3px solid #d4d8df',boxShadow:'0 24px 60px rgba(0,0,0,.45)'});
mk('div','abs',board,C.after.lanes.map(l=>`<i style="flex:1;background:${l.color}"></i>`).join('')).style.cssText='left:18px;right:18px;top:18px;height:10px;border-radius:5px;overflow:hidden;display:flex';
for(let i=1;i<3;i++){ const ln=mk('div','abs',board); Object.assign(ln.style,{left:'18px',right:'18px',top:(46+i*ROW)+'px',height:'2px',background:'#e1e4ea'}); }
// 업무 조각: 포스트잇 · 메신저 알림 · 메모지 (내용 = result.reviews)
const REV = C.result.reviews.slice(0,3);
const lines = s => esc(s).split(' · ').join('<br>');
const FRAG = [
  { w:250, h:200, html:r=>`<div style="padding:26px 24px;font-size:33px;font-weight:800;line-height:1.3;color:#3b2f00">${lines(r.text)}</div>`,
    css:'background:#FFE066;border-radius:4px;box-shadow:0 14px 30px rgba(0,0,0,.45)', from:[170,150,-8], to:0.62 },
  { w:400, h:124, html:r=>`<div style="display:flex;gap:16px;align-items:center;padding:18px 20px"><div class="ic ic-kakao" style="width:72px;height:72px;border-radius:18px;font-size:22px;flex:none">TALK</div><div style="min-width:0"><div style="font-size:21px;color:#6b6b70">${esc(C.hook.notifications[0].name)} · 지금</div><div style="font-size:31px;font-weight:800;color:#111;white-space:nowrap">${esc(r.text)}</div></div></div>`,
    css:'background:rgba(255,255,255,.97);border-radius:26px;box-shadow:0 14px 30px rgba(0,0,0,.45)', from:[760,140,5], to:0.5 },
  { w:260, h:190, html:r=>`<i style="position:absolute;left:85px;top:-14px;width:90px;height:30px;background:rgba(220,220,200,.8);transform:rotate(-4deg)"></i><div style="padding:30px 24px;font-size:31px;font-weight:700;line-height:1.35;color:#2b2b2b">${lines(r.text)}</div>`,
    css:'background:#f6f3ea;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.45)', from:[250,1320,4], to:0.62 },
].map((f,i)=>{ const r=REV[i], e=mk('div','abs',Lcmp,f.html(r)); e.style.cssText+=`;left:0;top:0;width:${f.w}px;height:${f.h}px;${f.css};transform-origin:50% 50%`;
  const tx=BD.x+26+f.w*f.to/2, ty=BD.y+46+ROW*i+ROW/2;
  const col=LANE_COLOR[r.lane]||'#888', step={'대기':1,'검토중':2,'전달됨':3}[r.status]||2;
  const meta=mk('div','abs',board,`<div style="display:flex;align-items:center;gap:12px"><div style="width:54px;height:54px;border-radius:50%;background:${col};color:#000;font-size:27px;font-weight:900;display:flex;align-items:center;justify-content:center">${esc(r.who)}</div>`+
    `<div style="font-size:24px;font-weight:900;color:${col};border:2px solid ${col};border-radius:20px;padding:4px 14px;white-space:nowrap;background:#fff">${esc(r.status)}</div></div>`+
    `<div style="display:flex;gap:8px;margin-top:12px;margin-left:66px">${[0,1,2].map(k=>`<i style="width:26px;height:8px;border-radius:4px;background:${k<step?col:'#d4d8df'}"></i>`).join('')}</div>`);
  Object.assign(meta.style,{left:(BD.w-196)+'px',top:(46+ROW*i+ROW/2-42)+'px'});
  return {e, f, tx, ty, meta};
});
const cmpLbl = [C.compare.before, C.compare.after].map((c,i)=>{
  const g=mk('div','abs',Lcmp); Object.assign(g.style,{left:0,top:0,width:W+'px',height:H+'px'});
  const tg=mk('div','abs',g,`<div class="tag" style="background:${i?'#4F8CFF':'#FF5A5F'};color:#000">${esc(c.tag)}</div>`); Object.assign(tg.style,{left:'0',right:'0',top:'1490px',textAlign:'center'});
  setTx(bigText(g, esc(c.text), 1640, 96),{o:1}); return g; });
CUES.hits.push({t:T.cmpAfter,k:'resolve'});
function renderCmp(t){
  const a=T.compare, on2=t>=T.cmpAfter, B=T.beat;
  // 배경: 하드 컷 매치 컷 (같은 카메라 · 같은 배율)
  [cmpBgB.cv,cmpBgB.shade].forEach(e=>e&&(e.style.display=on2?'none':'block'));
  [cmpBgA.cv,cmpBgA.shade].forEach(e=>e&&(e.style.display=on2?'block':'none'));
  if(on2) cmpBgA.draw(t-T.cmpAfter, 1.03); else cmpBgB.draw(t-a, 1.03+0.015*P(t,a,T.cmpAfter));
  cmpTint.style.background = on2 ? 'rgba(20,70,160,.12)' : 'rgba(120,10,15,.08)';
  cmpLbl[0].style.opacity = on2?0:1; cmpLbl[1].style.opacity = on2?1:0;
  board.style.opacity = on2?1:0;
  // BEFORE: 포즈가 먼저 읽히도록 1/4박 뒤부터, 조각이 8분의 1박 간격으로 머리·손을 피해 주변에 붙음 → AFTER: 컷과 함께 보드 자리로 스냅
  const mv = eExpo(P(t, T.cmpAfter, T.cmpAfter+0.2));
  FRAG.forEach((g,i)=>{
    const [fx,fy,fr]=g.f.from, pin=eExpo(P(t, a+B/4+i*B/8, a+B/4+i*B/8+0.1));
    const x=lerp(fx,g.tx,mv), y=lerp(fy,g.ty,mv), r=lerp(fr,0,mv), s=lerp(lerp(1.15,1,pin),g.f.to,mv);
    g.e.style.opacity=on2?1:pin; g.e.style.zIndex=on2?5:3;
    g.e.style.transform=`translate(${x-g.f.w/2}px,${y-g.f.h/2}px) rotate(${r}deg) scale(${s})`;
    const mp=eExpo(P(t, T.cmpAfter+0.2+i*B/4, T.cmpAfter+0.2+i*B/4+0.15));
    g.meta.style.opacity=on2?mp:0; g.meta.style.transform=`translateX(${lerp(16,0,mp)}px)`;
  });
}

/* =====================================================================
   8) CORE MESSAGE
   ===================================================================== */
const Lcore = layer();
const core1 = bigText(Lcore, esc(C.core.first), 900, 92, 960, '#d6d6d6');
function hl(s){const h=C.core.highlight; return h&&s.includes(h)? esc(s).replace(esc(h),`<span style="color:${C.brand.accent};position:relative">${esc(h)}<i class="ul" style="position:absolute;left:0;right:0;bottom:-6px;height:12px;background:${C.brand.accent};border-radius:6px;transform-origin:left;display:block"></i></span>`) : esc(s);}
const core2 = C.core.second.map((s,i)=>bigText(Lcore, hl(s), 1000+i*185, 168));
const uls=[...Lcore.querySelectorAll('.ul')];
// 핵심 카피: 짧은 사일런스 드롭 → 박자 위에 두 번째 문장, 카메라 푸시인
CUES.silence.push([T.core2-0.5*T.beat, T.core2]); CUES.hits.push({t:T.core,k:'soft'},{t:T.core2,k:'lift'});
function renderCore(t){
  const B=T.beat, p=eExpo(P(t,T.core,T.core+0.35)); const m=eInOut(P(t,T.core2,T.core2+0.5*B));
  Lcore.style.transform=`scale(${1+0.045*eInOut(P(t,T.core2,T.cta))})`;
  setTx(core1,{o:clamp(P(t,T.core,T.core+0.15))*lerp(1,0.45,m), y:lerp(24,0,p)+lerp(0,-240,m), s:lerp(1,0.8,m)});
  core2.forEach((e,i)=>punch(e,t,T.core2+i*0.5*B,1e9,1.2));
  uls.forEach(u=>u.style.transform=`scaleX(${eCubic(P(t,T.core2+1*B,T.core2+1.5*B))})`);
}

/* =====================================================================
   9) CTA
   ===================================================================== */
const Lcta = layer();
const ctaBg = bgLayer(Lcta, 'cta');   // 정돈된 밝은 책상 실사 — '통제된 여유'
const svc = mk('div','svc',Lcta,esc(C.cta.service)); svc.style.top='430px';
const q = C.cta.question.map((s,i)=>bigText(Lcta, esc(s), 690+i*165, 140));
const ring = mk('div','ring',Lcta); ring.style.top='1070px';
const btn = mk('div','btn',Lcta,esc(C.cta.button)); btn.style.top='1070px';
{ let s=56; btn.style.fontSize=s+'px'; while(btn.scrollWidth>840&&s>30){s-=2;btn.style.fontSize=s+'px';} }
const brandBox = mk('div','abs',Lcta, `${C.brand.logo?`<img src="${C.brand.logo}" style="width:120px;height:120px;border-radius:30px;object-fit:contain">`:'<div class="logo-ph">LOGO</div>'}<div style="font-size:48px;font-weight:900;letter-spacing:-0.02em">${esc(C.brand.name)}</div>`);
Object.assign(brandBox.style,{left:'0',right:'0',top:'1560px',display:'flex',alignItems:'center',justifyContent:'center',gap:'28px'});
CUES.hits.push({t:T.cta,k:'resolve'},{t:T.cta+T.beat,k:'bell'});
function renderCta(t){
  const a=T.cta, B=T.beat;
  ctaBg.draw(t-a, 1.0 + 0.03*P(t,a,T.end));            // 아주 느린 푸시인
  const p=eExpo(P(t,a,a+0.4)); svc.style.opacity=p; svc.style.transform=`translate(-50%,-50%) translateY(${lerp(20,0,p)}px)`;
  q.forEach((e,i)=>punch(e,t,a+0.5*B+i*0.5*B,1e9,1.15));
  const b=eExpo(P(t,a+B,a+1.5*B)); btn.style.opacity=clamp(b); btn.style.transform=`translate(-50%,0) scale(${lerp(0.96,1,b)})`;
  const rp=(((t-a-2*B)/(2*B))%1+1)%1; const on=t>a+2*B; ring.style.opacity=on?(1-rp)*0.45:0; ring.style.transform=`translate(-50%,0) scale(${1+rp*0.08},${1+rp*0.25})`;   // 2박마다 한 번, 조용히
  const bp=eExpo(P(t,a+1.5*B,a+2*B)); brandBox.style.opacity=bp; brandBox.style.transform=`translateY(${lerp(20,0,bp)}px)`;
}

/* =====================================================================
   MASTER RENDER
   ===================================================================== */
const SCENES = [
  [Lhook, T.hook, T.stop, renderHook],
  [Lstop, T.stop, T.before, renderStop],
  [Ldesk, T.before, T.turnMorph, (t)=>{ renderDesk(deskTime(t), DESK_END-0.0001);
      const fz=P(t,T.turn,T.turn+0.01); Ldesk.style.filter = t>=T.turn?'grayscale(1) brightness(.75)':''; Ldesk.style.transform=t>=T.turn?`scale(${1+0.03*P(t,T.turn,T.turnMorph)})`:''; }],
  [Lturn, T.turnMorph, T.after, renderTurn],
  [Lflow, T.after, T.result+0.2, renderFlow],
  [Ldash, T.gather, T.compare, renderDash],
  [Lcmp, T.compare, T.core, renderCmp],
  [Lcore, T.core, T.cta, renderCore],
  [Lcta, T.cta, T.end+1, renderCta],
];
function render(t){
  Lflow.style.zIndex=5; Ldash.style.zIndex=4;
  for(const [L,a,b,fn] of SCENES){ const on=t>=a&&t<b; L.style.display=on?'block':'none'; if(on) fn(t); }
  // 분해 시작 순간: 정지된 데스크톱이 분해 조각 뒤로 사라짐
  if(t>=T.turnMorph && t<T.turnMorph+0.3){ Ldesk.style.display='block'; renderDesk(deskTime(t), DESK_END-0.0001); Ldesk.style.filter='grayscale(1) brightness(.75)'; Ldesk.style.opacity=1-P(t,T.turnMorph,T.turnMorph+0.3); }
  else { Ldesk.style.opacity=1; }
  // 컷 전환 플래시 (구조 전환점)
  // 임팩트 프레임: 구조 완성 순간 2프레임만 밝게
  flash.style.opacity = t>=T.turnText&&t<T.turnText+2/30 ? 0.16 : 0;
}
render(0);
CUES.T = T;
window.ASSETS_READY = Promise.all(bgImgsAll.map(im => im.decode().catch(() => {})));
window.render = render; window.CUES = CUES; window.DURATION = C.duration || T.end;

/* 미리보기: 브라우저에서 열면 자동 재생 (렌더링 시에는 ?render=1) */
if(!location.search.includes('render')){
  const fit=()=>{const s=Math.min(innerWidth/W, innerHeight/H); stage.style.transform=`scale(${s})`; document.body.style.height=innerHeight+'px';};
  fit(); addEventListener('resize',fit);
  const au = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null; let st=null;
  const loop=(now)=>{ if(st==null) st=now; const t=((now-st)/1000)%window.DURATION; render(t); requestAnimationFrame(loop); };
  document.addEventListener('click',()=>{ st=null; if(au){au.currentTime=0; au.play();} });
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
