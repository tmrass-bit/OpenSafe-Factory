<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Shortform Engine — Minimal (V2)</title>
<style>
  /* Zapier V2 전용. engine/template.html(EP01)과 완전히 분리된 독립 파일.
     사진은 항상 정지 — 움직이는 건 타이포/디자인 레이어(transform, opacity, clip-path, gradient)뿐. */
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#000; overflow:hidden; }
  body { font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#000; transform-origin:0 0; }
  .layer { position:absolute; inset:0; display:none; }
  .photoFill { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .dim { position:absolute; inset:0; background:#000; }
  .cap { position:absolute; left:50%; top:960px; transform:translate(-50%,-50%); width:940px; text-align:center;
         font-weight:900; letter-spacing:-0.03em; line-height:1.28; will-change:transform,opacity; }
  .word { position:absolute; left:50%; top:960px; transform:translate(-50%,-50%); font-weight:900; font-size:118px;
          letter-spacing:-0.03em; white-space:nowrap; will-change:transform,opacity; }
  .climaxBox { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:900px; height:590px;
               overflow:hidden; border-radius:28px; border:2px solid #FF4A00; box-shadow:0 30px 80px rgba(0,0,0,.6); background:#0d0d0f; }
  .climaxImg { position:absolute; left:50%; top:0; }
  .wordmark { position:absolute; left:50%; top:960px; transform:translate(-50%,-50%); font-size:100px; font-weight:900; letter-spacing:-0.02em; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* =====================================================================
   ZAPIER V2 — 정지사진 + 타이포 모션만으로 만드는 15초 minimal engine.
   V1(engine/template_minimal.html 이전 버전)은 실패 시안으로 동결되어 있고,
   이 파일은 그 V1을 대체하는 새 구현이다 (V1의 episode/out 산출물은 건드리지 않음).
   ===================================================================== */
const C = window.CONFIG;
const W = 1080, H = 1920;
// 잠금된 타임라인(초). config.timeline으로 개별 값 덮어쓰기 가능.
const TB = {
  open:0, b1:1.0, b2:1.6, b3:2.2, b4:2.8, b5:3.4, turn:4.1,
  proofIn:5.4, a1:6.0, a2:6.6, a3:7.2, a4:7.8, proofFull:8.4,
  close:9.1, end:12.0, hold:14.5, total:15.0
};
const T = Object.assign({}, TB, C.timeline || {});

const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a,x));
const P = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,x) => a + (b-a)*x;
const eCubic = x => 1 - Math.pow(1-x, 3);
const eBack = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }; // 오버슈트(snap)
const stage = document.getElementById('stage');
function mk(tag, cls, parent, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; (parent||stage).appendChild(e); return e; }
function layer(){ return mk('div','layer'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
// 글자 안에 orange gradient가 이동하는 sweep (배경 텍스트가 아니라 typography layer 자체의 색 변화)
function gradientSweep(el, progress){
  el.style.background = 'linear-gradient(90deg,#fff 0%,#FF4A00 45%,#fff 90%)';
  el.style.backgroundSize = '260% 100%';
  el.style.backgroundPosition = lerp(130, -30, progress) + '% 0';
  el.style.webkitBackgroundClip = 'text'; el.style.backgroundClip = 'text'; el.style.color = 'transparent';
}

/* ---------- 장면 레이어 ---------- */
const Lopen = layer(), Lbefore = layer(), Lturn = layer(), Lclimax = layer(), Lclose = layer(), Lend = layer();

/* ===== OPEN (0.0–1.0): clip-path reveal + "끊기는"에 orange gradient sweep ===== */
function renderOpen(t){
  Lopen.innerHTML = '';
  mk('div','dim', Lopen).style.background = '#0b0b0d';
  const full = (C.open && C.open.text) || '업무가 끊기는 순간.';
  const hi = (C.open && C.open.highlight) || '끊기는';
  const idx = full.indexOf(hi);
  const pre = idx >= 0 ? full.slice(0, idx) : full, post = idx >= 0 ? full.slice(idx + hi.length) : '';
  const wrap = mk('div','cap', Lopen, `<span>${esc(pre)}</span><span id="ohi">${esc(hi)}</span><span>${esc(post)}</span>`);
  wrap.style.fontSize = '80px';
  const reveal = eCubic(P(t, 0, 0.18));
  wrap.style.clipPath = `inset(0 ${lerp(100, 0, reveal)}% 0 0)`;
  const hiEl = wrap.querySelector('#ohi');
  if (hiEl) gradientSweep(hiEl, P(t, 0, 0.5));
}

/* ===== BEFORE (1.0–4.1): 사진 5장, 각각 1회만. 사진은 정지, 캡션만 다른 모션 ===== */
const BEFORE_ITEMS = (C.before && C.before.items) || [];
const BEFORE_SPANS = [[T.b1,T.b2],[T.b2,T.b3],[T.b3,T.b4],[T.b4,T.b5],[T.b5,T.turn]];
function renderBefore(t){
  Lbefore.innerHTML = '';
  let i = 0; while (i < BEFORE_SPANS.length - 1 && t >= BEFORE_SPANS[i][1]) i++;
  const item = BEFORE_ITEMS[i]; if (!item) return;
  const [a, b] = BEFORE_SPANS[i]; const localT = t - a;
  const img = mk('img','photoFill', Lbefore); img.src = item.image;
  mk('div','dim', Lbefore).style.opacity = 0.32;
  const capEl = mk('div','cap', Lbefore, esc(item.word));
  capEl.style.fontSize = '104px';
  switch (item.effect) {
    case 'riseIn': { // 받고: translateY 35→0 + opacity 0→1
      const p = eCubic(P(localT, 0, 0.35));
      capEl.style.opacity = P(localT, 0, 0.3);
      capEl.style.transform = `translate(-50%,-50%) translateY(${lerp(35, 0, p)}px)`;
      break; }
    case 'slideSnap': { // 옮기고: translateX -55→0, 끝에서 snap(오버슈트)
      const p = eBack(P(localT, 0, 0.4));
      capEl.style.opacity = P(localT, 0, 0.15);
      capEl.style.transform = `translate(-50%,-50%) translateX(${lerp(-55, 0, p)}px)`;
      break; }
    case 'firstCharPop': { // 붙이고: "붙"만 scale 1.25→1.0
      const chars = item.word.split('');
      capEl.innerHTML = chars.map((c,ci)=>`<span style="display:inline-block">${esc(c)}</span>`).join('');
      capEl.style.opacity = P(localT, 0, 0.15);
      const first = capEl.children[0];
      if (first) first.style.transform = `scale(${lerp(1.25, 1, eCubic(P(localT, 0, 0.35)))})`;
      break; }
    case 'revealSweep': { // 알리고: 위쪽 reveal(아래→위로 드러남) + 짧은 gradient sweep
      const p = eCubic(P(localT, 0, 0.3));
      capEl.style.clipPath = `inset(0 0 ${lerp(100, 0, p)}% 0)`;
      gradientSweep(capEl, P(localT, 0, 0.5));
      break; }
    case 'scaleUp': { // 다시: scale .90→1.35, 화면 중앙을 크게 점유(TURN 진입 직전 climax)
      const p = eCubic(P(localT, 0, 0.55));
      capEl.style.transform = `translate(-50%,-50%) scale(${lerp(0.9, 1.35, p)})`;
      break; }
  }
}

/* ===== TURN (4.1–5.4): 유일한 강한 정지점. 거의-black 고대비, 빠르게 등장 후 완전 정지 ===== */
function renderTurn(t){
  Lturn.innerHTML = '';
  mk('div','dim', Lturn).style.background = '#050506';
  const lines = (C.turn && C.turn.lines) || [];
  const cap = mk('div','cap', Lturn, lines.map(esc).join('<br>'));
  cap.style.fontSize = '70px'; cap.style.color = '#fff';
  const p = eCubic(P(t, T.turn, T.turn + 0.15)); // 등장 이후엔 P가 1로 고정되어 완전 정지
  cap.style.opacity = p;
  cap.style.transform = `translate(-50%,-50%) translateY(${lerp(18, 0, p)}px)`;
}

/* ===== CLIMAX (5.4–9.1): PROOF+AFTER 통합. 같은 고정 박스, 사진(스크린샷)은 정지 —
   구간 사이는 crop을 "즉시 전환"만(카메라 pan/zoom 없음), 움직이는 건 캡션 타이포뿐. ===== */
const CLIMAX_ASPECT = 340 / 520;
const CLIMAX_FOCUS = { forms: 0.132, sheets: 0.45, gmail: 0.76, next: 0.926, full: 0.5 };
const CLIMAX_ZOOM = { forms: 1.9, sheets: 1.9, gmail: 1.9, next: 1.9, full: 1.0 };
function setClimaxCrop(img, boxW, boxH, key){
  const zoom = CLIMAX_FOCUS[key] != null ? CLIMAX_ZOOM[key] : 1;
  const w = boxW * zoom, h = w * CLIMAX_ASPECT;
  img.style.width = w + 'px';
  const yFrac = CLIMAX_FOCUS[key] != null ? CLIMAX_FOCUS[key] : 0.5;
  img.style.transform = `translateX(-50%) translateY(${boxH / 2 - yFrac * h}px)`;
}
function renderClimax(t){
  Lclimax.innerHTML = '';
  const box = mk('div','climaxBox', Lclimax);
  const img = mk('img','climaxImg', box); if (C.proof && C.proof.image) img.src = C.proof.image;
  const capLayer = mk('div', null, Lclimax);

  if (t < T.a1) { // 5.4–6.0: 진입, orange accent 강조, 텍스트 없음
    const p = eCubic(P(t, T.proofIn, T.proofIn + 0.25));
    box.style.opacity = p;
    box.style.boxShadow = `0 0 ${lerp(0,70,p)}px rgba(255,74,0,${lerp(0,.55,p)}), 0 30px 80px rgba(0,0,0,.6)`;
    setClimaxCrop(img, 900, 590, 'full');
    return;
  }
  if (t < T.proofFull) { // 6.0–8.4: Forms → Sheets → Gmail → + (crop은 즉시 전환, pan 없음)
    const beats = [[T.a1,T.a2,'forms','받고'],[T.a2,T.a3,'sheets','잇고'],[T.a3,T.a4,'gmail','닿고'],[T.a4,T.proofFull,'next','다음']];
    let cur = beats[beats.length - 1];
    for (const beat of beats) { if (t >= beat[0] && t < beat[1]) { cur = beat; break; } }
    const [a, b, key, word] = cur; const localT = t - a;
    // 이 4컷(받고/잇고/닿고/다음)은 orange frame/border 없음 — orange는 텍스트 색/gradient에만 사용
    box.style.border = 'none';
    box.style.boxShadow = '0 30px 80px rgba(0,0,0,.6)';
    setClimaxCrop(img, 900, 590, key);
    const wEl = mk('div','word', capLayer, esc(word));
    wEl.style.fontSize = '96px';
    wEl.style.textShadow = '0 0 26px rgba(0,0,0,.85), 0 0 55px rgba(0,0,0,.7), 0 4px 10px rgba(0,0,0,.9)';
    if (key === 'forms') { // 아래→위 빠른 등장
      const p = eCubic(P(localT, 0, 0.22));
      wEl.style.opacity = p; wEl.style.transform = `translate(-50%,-50%) translateY(${lerp(40, 0, p)}px)`;
    } else if (key === 'sheets') { // 글자 내부 orange gradient 좌→우
      wEl.style.opacity = 1; gradientSweep(wEl, P(localT, 0, b - a));
    } else if (key === 'gmail') { // 좌→우 이동 후 snap
      const p = eBack(P(localT, 0, 0.4));
      wEl.style.opacity = P(localT, 0, 0.15);
      wEl.style.transform = `translate(-50%,-50%) translateX(${lerp(-60, 0, p)}px)`;
    } else { // 다음: scale .85→1.15→1.0, orange accent, safe area 안(고정 박스 안쪽으로만 스케일 — 박스 자체는 불변)
      const p1 = P(localT, 0, 0.22), p2 = P(localT, 0.22, 0.5);
      const s = p2 > 0 ? lerp(1.15, 1.0, eCubic(p2)) : lerp(0.85, 1.15, eCubic(p1));
      wEl.style.opacity = Math.max(p1, 0.001);
      wEl.style.color = '#FF4A00';
      wEl.style.transform = `translate(-50%,-50%) scale(${s})`;
    }
    return;
  }
  // 8.4–9.1: workflow 전체를 한 번 보여줌, 텍스트 없음
  setClimaxCrop(img, 900, 590, 'full');
}

/* ===== CLOSE (9.1–12.0) + END (12.0–15.0): 클라이맥스보다 명확히 느린 호흡 ===== */
function renderClose(t){
  Lclose.innerHTML = '';
  mk('div','dim', Lclose).style.background = '#0a0a0c';
  const lines = (C.close && C.close.lines) || [];
  const half = (T.end - T.close) / 2;
  if (lines[0]) { const e1 = mk('div','cap', Lclose, esc(lines[0])); e1.style.fontSize='68px'; e1.style.top='860px';
    const p = eCubic(P(t, T.close, T.close + 0.6)); e1.style.opacity = p; e1.style.transform = `translate(-50%,-50%) translateY(${lerp(20,0,p)}px)`; }
  if (lines[1] && t >= T.close + half * 0.5) { const e2 = mk('div','cap', Lclose, esc(lines[1])); e2.style.fontSize='68px'; e2.style.top='1000px';
    const p = eCubic(P(t, T.close + half * 0.5, T.close + half * 0.5 + 0.6)); e2.style.opacity = p; e2.style.transform = `translate(-50%,-50%) translateY(${lerp(20,0,p)}px)`; }
}
function renderEnd(t){
  Lend.innerHTML = '';
  const p = eCubic(P(t, T.end, T.end + 0.6)); // 효과 최소: opacity fade만
  if (C.end && C.end.logo) {
    const img = mk('img', null, Lend); img.src = C.end.logo;
    Object.assign(img.style, { position:'absolute', left:'50%', top:'50%', transform:'translate(-50%,-50%)', maxWidth:'620px', opacity:p });
  } else {
    const el = mk('div','wordmark', Lend, esc((C.end && C.end.wordmark) || C.brand.name));
    el.style.color = (C.brand && C.brand.accent) || '#FF4A00'; el.style.opacity = p;
  }
}

const SCENES = [
  [Lopen,   T.open,  T.b1,   renderOpen],
  [Lbefore, T.b1,    T.turn, renderBefore],
  [Lturn,   T.turn,  T.proofIn, renderTurn],
  [Lclimax, T.proofIn, T.close, renderClimax],
  [Lclose,  T.close, T.end,  renderClose],
  [Lend,    T.end,   T.total + 1, renderEnd],
];
function render(t){
  for (const [L, a, b, fn] of SCENES){ const on = t >= a && t < b; L.style.display = on ? 'block' : 'none'; if (on) fn(t); }
}
render(0);
window.CUES = { T };
window.ASSETS_READY = Promise.resolve();
window.render = render;
window.DURATION = C.duration || T.total;

/* 미리보기: 브라우저에서 열면 자동 재생 (렌더링 시에는 ?render=1) */
if (!location.search.includes('render')){
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; document.body.style.height = innerHeight + 'px'; };
  fit(); addEventListener('resize', fit);
  const au = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null; let st = null;
  const loop = (now) => { if (st == null) st = now; const t = ((now - st) / 1000) % window.DURATION; render(t); requestAnimationFrame(loop); };
  document.addEventListener('click', () => { st = null; if (au){ au.currentTime = 0; au.play(); } });
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
